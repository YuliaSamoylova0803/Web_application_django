{% extends 'mailing_service/recipient_list.html' %}


{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">

                    <div class="card-body">
                        <p class="card-text">{{ recipient.full_name }}</p>
                        <p class="card-text">Электронная почта: {{ recipient.email }}</p>
                        <p class="card-text">Дополнительная информация: {{ recipient.comment }} </p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'mailing_service:recipient_list' %}"
                                   role="button">Назад</a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
