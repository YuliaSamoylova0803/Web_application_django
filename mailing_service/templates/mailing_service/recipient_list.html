{% extends 'mailing_service/base.html' %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for recipient in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">{{ recipient.full_name }}</p>
                        <p class="card-text">{{ recipient.email }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-mint" href="{% url 'mailing_service:recipient_detail' recipient.pk %}" role="button">Посмотреть</a>
                                <a class="btn btn-secondary" href="{% url 'mailing_service:recipient_update' recipient.pk %}" role="button">Редактировать</a>
                                <a class="btn btn-danger" href="{% url 'mailing_service:recipient_delete' recipient.pk %}" role="button">Удалить</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col">
                <p>Список пуст.{{ object_list|length }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
