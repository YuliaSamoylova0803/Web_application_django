{% extends 'mailing_service/base.html' %}

{% block content %}
<div class="container">
    <div class="row">

        <div class="form">
            <div class="col-6">
                <form class="row" method="post" enctype="multipart/form-data">
                    <div class="card">
                        <p class="card-text">Действительно хотите удалить {{ object.subject_message }}</p>
                        <div class="card-body">
                            {% csrf_token %}
                        </div>
                        <button type="submit" class="btn- btn-danger">Удалить</button>
                        <a class="btn btn-primary" href="{% url 'mailing_service:message_list' %}" role="button">Отменить</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
{% endblock %}
